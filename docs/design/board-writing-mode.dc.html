<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Board in writing mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1F1F;text-decoration:none}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Segoe UI', system-ui, sans-serif; color: #1F1F1F">

  <div style="position: absolute; left: 96px; top: 84px; font-family: 'Caveat', cursive; font-weight: 700; font-size: 56px; line-height: 90px">
    <div style="color: #1A1A1A; white-space: nowrap">I am at a desk</div>
    <div style="color: #1A1A1A; white-space: nowrap">The lazy dog jumps over the fence</div>
    <div style="color: #1E5BD8; white-space: nowrap">Ollie is writing a square and a triangle</div>
    <div style="display: flex; align-items: flex-start; height: 90px; color: #1A1A1A; white-space: pre">
      <span>Pythagoras drew a </span>
      <span style="position: relative; display: inline-block; height: 90px">
        rect
        <sc-if value="{{showNarrow}}" hint-placeholder-val="{{true}}">
          <span aria-hidden="true" style="position: absolute; left: -14px; top: 0; width: 150px; height: 90px; box-sizing: border-box; border: 2px solid #5A6E8C; border-radius: 18px; background: rgba(90, 110, 140, 0.04); opacity: {{outlineOpacity}}"></span>
        </sc-if>
        <sc-if value="{{rowRule}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" style="position: absolute; left: -14px; top: 0; width: 450px; height: 90px; box-sizing: border-box; border: 2px solid #5A6E8C; border-radius: 18px; background: rgba(90, 110, 140, 0.04); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); opacity: {{outlineOpacity}}">
            <span style="padding: 4px 10px; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; line-height: 14px; color: #3F4E66">top row</span>
            <span style="padding: 4px 10px; border-left: 1px dashed #5A6E8C; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; line-height: 14px; color: #3F4E66">middle row</span>
            <span style="padding: 4px 10px; border-left: 1px dashed #5A6E8C; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; line-height: 14px; color: #3F4E66">bottom row</span>
          </span>
        </sc-if>
        <span aria-hidden="true" style="position: absolute; left: calc(100% + 8px); top: 20px; width: 2px; height: 50px; border-radius: 1px; background: #5A6E8C; opacity: {{outlineOpacity}}"></span>
      </span>
    </div>
  </div>

  <div role="status" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 6px 0 14px; background: #FFFFFF; border: 1px solid #E1E1DE; border-radius: 10px; font-size: 14px">
    <span style="width: 14px; height: 14px; border-radius: 50%; background: #1A1A1A"></span>
    <span style="font-weight: 600">Writing</span>
    <a href="board-mouse-mode.dc.html" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 6px; color: #5C5C5C">
      <span style="height: 20px; padding: 0 6px; border: 1px solid #CFCFCB; border-radius: 4px; font-size: 11px; line-height: 18px; color: #5C5C5C">Caps Lock</span>
      for the mouse
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rowRule":{"editor":"boolean","default":false},"outlineStrength":{"editor":"range","default":0.45,"min":0.15,"max":0.9,"step":0.05},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const rowRule = this.props.rowRule ?? false;
    return {
      rowRule: rowRule,
      showNarrow: !rowRule,
      outlineOpacity: this.props.outlineStrength ?? 0.45
    };
  }
}
</script>
</body>
</html>
